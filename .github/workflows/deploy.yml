name: Deploy to Homelab

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy TEZA
    runs-on: self-hosted   # ← runs on your homelab, zero GitHub minutes used

    steps:
      - name: Pull latest code
        run: |
          APP_DIR="/root/teza"
          REPO_URL="https://github.com/C-o-m-o-n/teza.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "First deploy — cloning..."
            mkdir -p "$APP_DIR"
            git clone --depth 1 "$REPO_URL" "$APP_DIR"
          else
            echo "Fetching and resetting..."
            git -C "$APP_DIR" fetch origin main
            git -C "$APP_DIR" reset --hard origin/main
          fi

      - name: Install production dependencies
        run: |
          cd /root/teza
          pnpm install --prod --frozen-lockfile

      - name: Ensure runtime directories exist
        run: |
          mkdir -p /root/teza/logs /root/teza/data/replays
          if [ ! -f /root/teza/data/players.json ]; then
            echo "{}" > /root/teza/data/players.json
            echo "Created empty data/players.json"
          fi

      - name: Restart server with PM2
        run: |
          cd /root/teza
          pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
          pm2 save

      - name: Health check
        run: |
          sleep 3
          curl --silent --fail --retry 5 --retry-delay 2 http://localhost:3000 > /dev/null
          echo "✅ TEZA is live on localhost:3000"
