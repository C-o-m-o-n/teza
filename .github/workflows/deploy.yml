name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy TEZA
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://teza.comonhq.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          command: deploy

      - name: Check deployed site
        run: |
          CURL="curl --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors"
          $CURL --fail "$SITE_URL/" > /dev/null
          $CURL --fail "$SITE_URL/game.js" > /dev/null
          # No upgrade header: the Worker itself must answer 426, proving /api/* reaches the script.
          STATUS=$($CURL --output /dev/null --write-out "%{http_code}" "$SITE_URL/api/match/ci-check")
          if [ "$STATUS" != "426" ]; then
            echo "::error::$SITE_URL/api/match/ci-check returned $STATUS, expected 426."
            exit 1
          fi
          echo "TEZA is live at $SITE_URL"
